[package]
name = "game-store"
version = "0.0.0"
edition = "2021"
publish = false
description = "SQLite persistence, migration, snapshot import and consistent backups"

[dependencies]
game-core = { path = "../game-core" }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.1"
